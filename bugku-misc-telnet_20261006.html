  <div class="glass">
    <h1>telnet</h1>
    <div class="tag">MISC | Bugku</div>
    <main>
      <h2>题目描述</h2>
      <p>提供pcap流量包，里面记录telnet会话的明文通信数据。</p>
      <h2>考点</h2>
      <p>Wireshark流量分析，telnet明文传输</p>
      <h2>解题过程</h2>
      <p>1.Wireshark打开pcap文件。</p>
      <p>2.过滤telnet流量，追踪TCP流。</p>
      <p>3.telnet是明文协议，直接在流中读取交互内容提取flag。</p>
<pre><code>wireshark过滤表达式：telnet
右键 → 追踪 → TCP流
</code></pre>
      <h2>Flag</h2>
      <div class="note"><code>flag{telnet_is_plaintext}</code></div>
      <h2>总结踩坑</h2>
      <p>telnet全部明文传输，生产环境禁止使用，应当使用ssh。</p>
    </main>
