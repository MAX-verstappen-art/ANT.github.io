    <main>
      <h2>题目描述</h2>
      <p>给出一串数字，题目提示绵羊，为ASCII码转换题。</p>
      <h2>考点</h2>
      <p>ASCII码转字符</p>
      <h2>解题过程</h2>
      <p>1.拿到一串十进制数字，每一个数字对应一个ASCII编码。</p>
      <p>2.逐个数字转成对应字符，拼接得到明文。</p>
      <p>3.整理为flag格式提交。</p>
<pre><code>#Python转换示例
s = [数字列表]
res = ''.join(chr(i) for i in s)
print(res)
</code></pre>
      <h2>Flag</h2>
      <div class="note"><code>flag{sheep_ascii_ok}</code></div>
      <h2>总结踩坑</h2>
      <p>区分十进制ASCII和十六进制，不要混用编码。</p>
    </main>
