    <div class="tag">CRYPTO | Bugku</div>
    <main>
      <h2>题目描述</h2>
      <p>给出由点和横组成密文，摩尔斯电码。</p>
      <h2>考点</h2>
      <p>摩尔斯(Morse)密码解码</p>
      <h2>解题过程</h2>
      <p>1.识别密文是摩尔斯电码，点代表·，横代表‑。</p>
      <p>2.在线摩斯密码解码工具，输入密文得到明文。</p>
      <p>3.明文拼接为flag格式。</p>
<pre><code>密文示例：..‑. .‑.‑‑ ···‑ ··‑‑
</code></pre>
      <h2>Flag</h2>
      <div class="note"><code>flag{morse_code_fun}</code></div>
      <h2>总结踩坑</h2>
      <p>摩尔斯密码注意字符分隔符，区分点与横不要搞混。</p>
    </main>
