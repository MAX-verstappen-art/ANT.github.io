<div class="container">
  <div class="back"><a href="index.html">← 返回首页</a></div>
  <div class="glass">
    <h1>copy‑error</h1>
    <div class="tag">CRYPTO | Bugku</div>
    <main>
      <h2>题目描述</h2>
      <p>复制出来文本看起来正常，但粘贴就乱码，存在大量零宽隐形字符。</p>
      <h2>考点</h2>
      <p>零宽字符隐写，零宽解码</p>
      <h2>解题过程</h2>
      <p>1.复制题目给出的密文，肉眼看不出区别。</p>
      <p>2.粘贴到零宽字符在线解码工具，提取隐藏在文本中的信息。</p>
      <p>3.拿到隐藏字符串，整理得到flag。</p>
<pre><code>#原理：零宽空格、零宽连字等不可见字符携带信息
</code></pre>
      <h2>Flag</h2>
      <div class="note"><code>flag{zero_width_secret}</code></div>
      <h2>总结踩坑</h2>
      <p>复制密文时不要漏字符，不能手动输入，必须完整复制原文。</p>
    </main>
  </div>
</div>
