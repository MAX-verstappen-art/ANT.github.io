    <div class="tag">RE | Bugku</div>
    <main>
      <h2>题目描述</h2>
      <p>Windows exe程序，运行提示输入密码，正确输出flag。</p>
      <h2>考点</h2>
      <p>简单逆向分析，IDA静态分析，字符串查找</p>
      <h2>解题过程</h2>
      <p>1.使用IDA Pro载入exe，Shift+F12打开字符串窗口。</p>
      <p>2.搜索flag相关字符串，找到比对密码与flag。</p>
      <p>3.运行程序输入正确密码得到flag。</p>
<pre><code>#工具
IDA Pro / x32dbg
</code></pre>
      <h2>Flag</h2>
      <div class="note"><code>flag{re_easy_beginner}</code></div>
      <h2>总结踩坑</h2>
      <p>32位程序用32位调试器，不要混用64位工具。</p>
    </main>
