  <div class="glass">
    <h1>GET</h1>
    <div class="tag">WEB | Bugku</div>
    <main>
      <h2>题目描述</h2>
      <p>提示使用GET方式提交参数，访问页面没有flag，需要在URL后拼接GET参数。</p>
      <h2>考点</h2>
      <p>GET传参，URL参数构造</p>
      <h2>解题过程</h2>
      <p>1. 打开原始页面，提示需要GET提交key参数。</p>
      <p>2. 在浏览器地址栏URL末尾拼接：<code>?key=bugku</code></p>
      <p>3. 访问拼接后的地址，后端读取GET参数，返回flag。</p>
<pre><code>构造URL示例：
http://xxx/?key=bugku
</code></pre>
      <h2>Flag</h2>
      <div class="note"><code>flag{get_method_is_simple}</code></div>
      <h2>总结踩坑</h2>
      <p>GET参数写在URL问号后面，多个参数用&分隔，注意不要漏写问号。</p>
    </main>
  </div>
</div>
