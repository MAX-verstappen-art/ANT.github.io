    <main>
      <h2>题目描述</h2>
      <p>给一个linux压缩包，解压后需要寻找隐藏文件。</p>
      <h2>考点</h2>
      <p>Linux隐藏文件，ls‑a查看以.开头文件</p>
      <h2>解题过程</h2>
      <p>1.解压文件，普通ls看不到flag文件。</p>
      <p>2.执行<code>ls -a</code>列出全部隐藏文件。</p>
      <p>3.cat读取隐藏文件内容拿到flag。</p>
<pre><code>ls -a
cat .flag
</code></pre>
      <h2>Flag</h2>
      <div class="note"><code>flag{linux_hidden_file}</code></div>
      <h2>总结踩坑</h2>
      <p>Linux以点开头的文件默认隐藏，必须ls‑a才能显示。</p>
    </main>
