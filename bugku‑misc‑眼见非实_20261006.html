  padding:0;

<div class="container">
  <div class="back"><a href="index.html">← 返回首页</a></div>
  <div class="glass">
    <h1>眼见非实</h1>
    <div class="tag">MISC | Bugku</div>

    <h2>题目描述</h2>
    <p>下载一张图片，肉眼看不到flag，实际藏在文件内容中。</p>

    <h2>考点</h2>
    <p>图片隐写，文件头检测，binwalk分离，或者记事本打开看末尾字符串。</p>

    <h2>解题过程</h2>
    <p>方法1：直接用记事本打开图片文件，滚动到文件末尾读取flag。</p>
<pre><code>#kali工具分离
binwalk -e 图片名.png
</code></pre>
    <p>方法2：kali使用binwalk检测，分离出隐藏文件。</p>
    <p>方法3：检查图片文件头，判断是否多张文件拼接。</p>

    <h2>Flag</h2>
    <div class="note"><code>flag{xxxxxxxxxxxxxxxx}</code></div>

    <h2>总结踩坑</h2>
    <p>不要只看图片预览，眼见非实，重点看文件原始二进制内容。</p>

  </div>
