    <h1>备份是个好习惯</h1>
    <div class="tag">WEB | Bugku</div>
    <main>
      <h2>题目描述</h2>
      <p>网站存在备份文件，常见备份后缀：.bak .swp .~ .txt。</p>
      <h2>考点</h2>
      <p>网站备份文件泄露，vim临时文件，源码备份</p>
      <h2>解题过程</h2>
      <p>1.尝试访问 index.php.bak 或者 index.php~ 获取备份源码。</p>
      <p>2.拿到PHP源代码，审计代码逻辑。</p>
      <p>3.按照源码逻辑构造参数，得到flag。</p>
<pre><code>#常见备份后缀
.bak  .swp  .~  .txt
</code></pre>
      <h2>Flag</h2>
      <div class="note"><code>flag{backup_file_leak_source}</code></div>
      <h2>总结踩坑</h2>
      <p>开发编辑文件会遗留vim临时文件，经常泄露源码。</p>
    </main>
  </div>
