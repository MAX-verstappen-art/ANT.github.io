<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bugku‑抄错的字符</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Consolas,monospace;
}
body{
  background:#0f1118;
  color:#e2e8f0;
  padding:24px;
  line-height:1.8;
}
.container{
  max-width:920px;
  margin:0 auto;
}
.back{
  margin-bottom:16px;
}
.back a{
  color:#7dd3fc;
  text-decoration:none;
}
.back a:hover{
  text-decoration:underline;
}
.glass{
  background:rgba(30,41,59,0.65);
  backdrop-filter:blur(12px);
  border:1px solid rgba(148,163,184,0.2);
  border-radius:14px;
  padding:28px;
}
h1{
  color:#7dd3fc;
  margin-bottom:12px;
  font-size:22px;
}
.tag{
  display:inline-block;
  background:#1e3a5f;
  color:#7dd3fc;
  padding:2px 8px;
  border-radius:4px;
  font-size:13px;
  margin-bottom:20px;
}
h2{
  color:#93c5fd;
  font-size:17px;
  margin:22px 0 10px;
}
pre{
  background:#0b1220;
  padding:14px;
  border-radius:8px;
  overflow-x:auto;
  border:1px solid #334155;
  margin:12px 0;
}
code{
  color:#a5f3fc;
  font-family:Consolas;
}
.note{
  background:rgba(30,64,100,0.35);
  border-left:3px solid #38bdf8;
  padding:10px 14px;
  border-radius:0 8px 8px 0;
  margin:14px 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="back"><a href="index.html">← 返回首页</a></div>
  <div class="glass">
    <h1>抄错的字符</h1>
    <div class="tag">CRYPTO | Bugku</div>

    <h2>题目描述</h2>
    <p>密文存在大量形近字符（O和0、l和1混淆），抄写出错，需要还原。</p>

    <h2>考点</h2>
    <p>形近字符替换，Base编码还原。</p>

    <h2>解题过程</h2>
    <p>1. 观察密文，把相似字符做替换：数字0和大写O，小写l和数字1。</p>
    <p>2. 修正字符之后进行Base64解码。</p>
    <p>3. 解码输出得到flag。</p>

<pre><code>#形近字符映射
0 ↔ O
1 ↔ l
</code></pre>

    <h2>Flag</h2>
    <div class="note"><code>flag{xxxxxxxxxxxxxxxx}</code></div>

    <h2>总结踩坑</h2>
    <p>直接解码会报错，必须先修正抄错的形近字符。</p>

  </div>
</div>
</body>
</html>
