<title>Bugku‑这是一张单纯的图片 Writeup</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box;font‑family:"Segoe UI",Consolas,monospace;}
body{background:#0f1118;color:#e2e8f0;padding:24px;line‑height:1.8;}
.container{max‑width:900px;margin:0 auto;}
.back{margin‑bottom:16px;}
.back a{color:#7dd3fc;text‑decoration:none;}
.back a:hover{text‑decoration:underline;}
.glass{background:rgba(30,41,59,0.65);backdrop‑filter:blur(12px);border:1px solid rgba(148,163,184,0.2);border‑radius:14px;padding:28px;}
h1{color:#7dd3fc;margin‑bottom:12px;font‑size:22px;}
.tag{display:inline‑block;background:#1e3a5f;color:#7dd3fc;padding:2px 8px;border‑radius:4px;font‑size:13px;margin‑bottom:20px;}
h2{color:#93c5fd;font‑size:17px;margin:22px 0 10px;}
pre{background:#0b1220;padding:14px;border‑radius:8px;overflow‑x:auto;border:1px solid #334155;margin:12px 0;}
code{color:#a5f3fc;font‑family:Consolas;}
.note{background:rgba(30,64,100,0.35);border‑left:3px solid #38bdf8;padding:10px 14px;border‑radius:0 8px 8px 0;margin:14px 0;}
</style>
</head>
<body>
<div class="container">
  <div class="back"><a href="index.html">← 返回首页</a></div>
  <div class="glass">
    <h1>这是一张单纯的图片</h1>
    <div class="tag">MISC | Bugku</div>
    <main>
      <h2>题目描述</h2>
      <p>一张png图片，打开看不到flag，图片隐写。</p>
      <h2>考点</h2>
      <p>文件拼接，图片+压缩包，binwalk分离</p>
      <h2>解题过程</h2>
      <p>1.下载图片，使用binwalk分析，发现图片尾部附加zip压缩包。</p>
      <p>2.binwalk ‑e 图片，分离出压缩包，解压得到flag文件。</p>
<pre><code>binwalk image.png
binwalk -e image.png
</code></pre>
      <h2>Flag</h2>
      <div class="note"><code>flag{picture_hide_zip}</code></div>
      <h2>总结踩坑</h2>
      <p>很多misc题目把压缩包藏在图片末尾，binwalk是首选工具。</p>
    </main>
  </div>
</div>
</body>
